name: MobileGL Plugin APK

on:
  push:
    branches:
      - dev
      - Feat/Backend-Direct-GLES
      - Feat/Backend-Direct-Vulkan
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set artifact metadata
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.3.13750724"
          echo "ndk.dir=$ANDROID_HOME/ndk/27.3.13750724" >> android-plugin/local.properties

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python update_glslang_sources.py

      # ============ 这里改了！ ============
      - name: Build plugin APK
        run: gradle --no-daemon -p android-plugin :app:assembleDebug
        # 删除了所有 sign 相关的环境变量
      # ===================================

      # ============ 改了验证逻辑 ============
      - name: Verify APK (Debug)
        run: |
          echo "✅ Debug APK built successfully (no signing required)"
          find android-plugin/app/build/outputs/apk -type f -path '*/debug/*.apk' | sort
      # ===================================

      - name: Upload plugin APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-plugin-${{ env.date_today }}-${{ env.short_sha }}-debug
          path: |
            android-plugin/app/build/outputs/apk/debug/*.apk
            android-plugin/app/build/outputs/apk/**/debug/*.apk
